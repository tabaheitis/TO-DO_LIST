<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5f7">
    <title>I miei task — To-Do List</title>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <p class="eyebrow">ORGANIZZAZIONE PERSONALE</p>
            <h1>I miei task</h1>
            <p class="subtitle">Una cosa alla volta. Tieni tutto sotto controllo.</p>
        </header>

        <form id="form-task" class="task-form">
            <label class="sr-only" for="campo-task">Nuovo task</label>
            <input
                type="text"
                id="campo-task"
                placeholder="Scrivi qui un task..."
                autocomplete="off"
                maxlength="180"
                required
            >
            <button type="submit">Aggiungi</button>
        </form>

        <section class="task-section" aria-label="Lista dei task">
            <ul id="lista" aria-live="polite"></ul>
            <p id="vuoto" class="empty-state">
                Non ci sono task. Aggiungine uno qui sopra!
            </p>
        </section>

        <footer class="app-footer">
            <p id="info" aria-live="polite"></p>
            <button
                id="pulisci-completati"
                class="clear-button"
                type="button"
                hidden
            >
                Elimina completati
            </button>
        </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
